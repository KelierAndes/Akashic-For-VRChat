name: 合并后构建

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 构建
        shell: pwsh
        run: ./scripts/build-app.ps1

      - name: 打包
        shell: pwsh
        run: ./scripts/stage-dist.ps1

      - name: 签名
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'update-signing-key.pem'
          [System.IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY)
          try {
            ./scripts/sign-release.ps1 -Zip dist/Akashic.zip -KeyPath $keyPath
          } finally {
            Remove-Item $keyPath -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Akashic-windows-${{ github.sha }}
          path: |
            dist/Akashic.zip
            dist/Akashic.zip.sig
            dist/Akashic.zip.sha256
          retention-days: 30
          if-no-files-found: error