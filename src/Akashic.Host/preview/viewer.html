<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefab Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191d; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; bottom: 10px;
    font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: #aeb6c2; pointer-events: none; z-index: 4;
  }
  #hint {
    position: fixed; left: 12px; top: 10px;
    font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: #aeb6c2; pointer-events: none; z-index: 4;
  }
  #hud b { color: #e8ecf2; font-weight: 600; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 13px "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #c3cad6;
    background: radial-gradient(circle at 50% 40%, #232830, #17191d 70%);
    transition: opacity .35s ease;
  }
  #status.hide { opacity: 0; pointer-events: none; }
  #status.error { color: #ff9f9f; }
  #spinner {
    width: 18px; height: 18px; margin-right: 10px; border-radius: 50%;
    border: 2px solid #3a4250; border-top-color: #8fb8ff; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #hlslView {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #17191d; z-index: 3;
  }
  #hlslView.on { display: flex; }
  #hlslCanvas {
    width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
  }
  #hlslCanvas.dragging { cursor: grabbing; }
  #gizmoView {
    position: fixed; right: 16px; top: 96px; width: 108px; height: 108px;
    z-index: 5; pointer-events: none;
  }
  #viewModes {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    display: none; gap: 6px; z-index: 6;
  }
  #viewModes.on { display: flex; }
  #viewModes button {
    padding: 5px 11px; border-radius: 7px; border: 1px solid #3a4250;
    background: rgba(28, 33, 41, 0.88); color: #aeb9c9; cursor: pointer;
    font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  #viewModes button.on { border-color: #6f9be8; color: #eef4ff; background: rgba(52, 82, 138, 0.92); }
  #hlslToggle {
    position: fixed; right: 14px; top: 12px; z-index: 4;
    padding: 7px 12px; border-radius: 8px; border: 1px solid #3a4250;
    background: rgba(32, 37, 45, 0.86); color: #c9d2e0; cursor: pointer;
    font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  #hlslToggle.on { border-color: #6f9be8; color: #eaf1ff; background: rgba(52, 82, 138, 0.9); }
  #hlslToggle:disabled { opacity: .5; cursor: default; }
  #bgToggle {
    position: fixed; right: 14px; top: 52px; z-index: 4;
    padding: 7px 12px; border-radius: 8px; border: 1px solid #3a4250;
    background: rgba(32, 37, 45, 0.86); color: #c9d2e0; cursor: pointer;
    font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  body.light { background: #edf0f4; }
  body.light #status {
    background: radial-gradient(circle at 50% 40%, #f9fafc, #e4e8ee 70%); color: #4a5260;
  }
  body.light #status.error { color: #ad3b3b; }
  body.light #hlslView { background: #edf0f4; }
  body.light #hlslToggle, body.light #bgToggle {
    background: rgba(255, 255, 255, 0.92); color: #3a4350; border-color: #c6ced9;
  }
  body.light #viewModes button {
    background: rgba(255, 255, 255, 0.92); color: #3a4350; border-color: #c6ced9;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./static/vendor/three.module.js" } }
</script>

<body>
<div id="stage"></div>
<div id="hlslView">
  <canvas id="hlslCanvas"></canvas>
</div>
<canvas id="gizmoView"></canvas>

  <button type="button" data-mode="textured" class="on">贴图</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './static/vendor/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from './static/vendor/jsm/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const build = params.get('build') || '';
const token = (location.pathname.split('/').filter(Boolean)[1] || '');
const stage = document.getElementById('stage');
const hlslView = document.getElementById('hlslView');
const bgToggle = document.getElementById('bgToggle');
const hlslToggle = document.getElementById('hlslToggle');
const statusBox = document.getElementById('status');
const message = document.getElementById('message');
const hint = document.getElementById('hint');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191d);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 4000);
camera.position.set(-2.2, 1.8, 2.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.target.set(0, 0.5, 0);
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };

const viewCamera = { yaw: -0.7033, pitch: 0.3915, distance: 0, target: null };

function orbitDir(yaw, pitch) {
  const cosPitch = Math.cos(pitch);
  return { x: Math.sin(yaw) * cosPitch, y: Math.sin(pitch), z: Math.cos(yaw) * cosPitch };
}

function syncCameraFromThree() {
  const eye = camera.position;
  const target = controls.target;
  const dx = eye.x - target.x;
  const dy = eye.y - target.y;
  const dz = eye.z - target.z;
  const length = Math.hypot(dx, dy, dz) || 1;

  viewCamera.target = { x: target.x, y: target.y, z: target.z };
  viewCamera.distance = length;
  viewCamera.yaw = Math.atan2(dx, dz);
  viewCamera.pitch = Math.asin(Math.max(-1, Math.min(1, dy / length)));
}

function hlslOrbitParams() {
  const target = viewCamera.target || { x: 0, y: 0.5, z: 0 };

  return {
    yaw: -viewCamera.yaw,
    pitch: viewCamera.pitch,
    distance: viewCamera.distance,
    hasTarget: true,
    targetX: -target.x,
    targetY: target.y,
    targetZ: target.z
  };
}

function applyCameraToThree() {
  const target = viewCamera.target || { x: 0, y: 0.5, z: 0 };
  const dir = orbitDir(viewCamera.yaw, viewCamera.pitch);
  const distance = viewCamera.distance || 1;

  camera.position.set(target.x + dir.x * distance, target.y + dir.y * distance, target.z + dir.z * distance);
  controls.target.set(target.x, target.y, target.z);
  controls.update();
}

renderer.domElement.addEventListener('pointerup', (event) => {
  if (hlslOn || event.button !== 0) return;
  viewClick(event);
});

renderer.domElement.addEventListener('dblclick', (event) => {
  if (hlslOn) return;
  viewDoubleClick(event);
});

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x30343c, 1.25));

const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(2.4, 4.2, 2.8);
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb8ff, 0.7);
fill.position.set(-3, 1.6, -2.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7b0, 0.5);
rim.position.set(0.4, 2.0, -3.4);
scene.add(rim);

let backgroundLight = false;
let grid = null;

function buildGrid() {
  if (grid) {
    scene.remove(grid);
    grid.geometry.dispose();
    grid.material.dispose();
  }
  grid = new THREE.GridHelper(
    4, 40,
    backgroundLight ? 0xa7b1c0 : 0x3a4454,
    backgroundLight ? 0xd2d8e1 : 0x262c36);
  grid.position.y = 0;
  scene.add(grid);
}

buildGrid();

function applyBackground() {
  scene.background = new THREE.Color(backgroundLight ? 0xedf0f4 : 0x17191d);
  document.body.classList.toggle('light', backgroundLight);
  bgToggle.textContent = backgroundLight ? '底色：浅色' : '底色：深色';
  buildGrid();
  if (hlslOn) requestHlsl(false);
}

window.akashicSetBackground = (light) => {
  if (!!light === backgroundLight) return;
  backgroundLight = !!light;
  applyBackground();
  if (hlslOn) requestHlsl(false);
};

window.akashicBackground = () => backgroundLight;

const box = new THREE.BoxHelper(new THREE.Object3D(), 0x8fb8ff);
box.visible = false;
scene.add(box);

const gizmoScene = new THREE.Scene();
const gizmoCamera = new THREE.OrthographicCamera(-1.5, 1.5, 1.5, -1.5, 0.1, 20);
gizmoCamera.position.set(0, 0, 8);

function axisLabel(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 44px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(12, 14, 18, 0.9)';
  ctx.strokeText(text, 32, 34);
  ctx.fillStyle = color;
  ctx.fillText(text, 32, 34);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texture, depthTest: false, transparent: true
  }));
  sprite.scale.setScalar(0.55);
  return sprite;
}

function axisGizmo(direction, color, text) {
  const dir = new THREE.Vector3(...direction);
  const up = new THREE.Vector3(0, 1, 0);
  const group = new THREE.Group();
  const material = new THREE.MeshBasicMaterial({ color, depthTest: false });

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.82, 10), material);
  shaft.position.copy(dir).multiplyScalar(0.41);
  shaft.quaternion.setFromUnitVectors(up, dir);
  group.add(shaft);

  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.3, 14), material);
  tip.position.copy(dir).multiplyScalar(0.97);
  tip.quaternion.setFromUnitVectors(up, dir);
  group.add(tip);

  const label = axisLabel(text, `#${color.toString(16).padStart(6, '0')}`);
  label.position.copy(dir).multiplyScalar(1.34);
  group.add(label);

  gizmoScene.add(group);
  return group;
}

axisGizmo([-1, 0, 0], 0xe05050, 'X');
axisGizmo([0, 1, 0], 0x50c860, 'Y');
axisGizmo([0, 0, 1], 0x5080e8, 'Z');
gizmoScene.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.1, 14, 10),
  new THREE.MeshBasicMaterial({ color: 0xc8d0dc, depthTest: false })));

let gizmoVisible = true;

const gizmoCanvas = document.getElementById('gizmoView');
const gizmoRenderer = new THREE.WebGLRenderer({ canvas: gizmoCanvas, antialias: true, alpha: true });
gizmoRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
gizmoRenderer.setSize(108, 108, false);
gizmoRenderer.setClearAlpha(0);

const gizmoProbe = new THREE.PerspectiveCamera(38, 1, 0.01, 100);

function activeGizmoQuaternion() {
  const dir = orbitDir(viewCamera.yaw, viewCamera.pitch);
  const target = viewCamera.target || { x: 0, y: 0.5, z: 0 };
  const distance = viewCamera.distance || 1;

  gizmoProbe.position.set(target.x + dir.x * distance, target.y + dir.y * distance, target.z + dir.z * distance);
  gizmoProbe.up.set(0, 1, 0);
  gizmoProbe.lookAt(target.x, target.y, target.z);
  return gizmoProbe.quaternion;
}

function drawGizmo() {
  gizmoCanvas.style.display = gizmoVisible ? 'block' : 'none';
  if (!gizmoVisible) return;

  gizmoScene.quaternion.copy(activeGizmoQuaternion()).invert();
  gizmoRenderer.render(gizmoScene, gizmoCamera);
}

const gradient = (() => {
  const data = new Uint8Array([45, 115, 180, 255]);
  const texture = new THREE.DataTexture(data, data.length, 1, THREE.RedFormat);
  texture.needsUpdate = true;
  texture.minFilter = THREE.NearestFilter;
  texture.magFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  return texture;
})();

let model = null;
let materialMeta = new Map();
let materialByName = new Map();
let selected = null;
let ready = false;
const applied = { liltoon: 0, toon: 0, unlit: 0, lit: 0 };

window.akashicSelect = (id) => {
  if (!model) return;
  selected = model.getObjectByName(id) || null;
  if (selected) {
    box.setFromObject(selected);
    box.visible = true;
  } else {
    box.visible = false;
  }

  if (!hlslOn) {
    renderer.render(scene, camera);
    drawGizmo();
  }
};

window.akashicFocus = (id) => {
  window.akashicSelect(id);
  if (!selected) return;
  frameObject(selected);
  if (hlslOn) requestHlsl(false);
};

window.akashicResetView = () => {
  if (model) frameObject(model);
  if (hlslOn) {
    requestHlsl(false);
    return;
  }

  renderer.render(scene, camera);
  drawGizmo();
};

const raycaster = new THREE.Raycaster();

function pickNode(clientX, clientY) {
  if (!model) return null;

  const rect = renderer.domElement.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return null;

  const ndc = new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);

  for (const hit of raycaster.intersectObject(model, true)) {
    let node = hit.object;
    while (node && !materialMeta.has(node.name)) node = node.parent;
    if (node && node.name) return node.name;
  }

  return null;
}

function notifyPick(id) {
  window.akashicSelect(id);
  window.flutter_inappwebview?.callHandler?.('akashicPick', id);
}

window.akashicSetFlat = (flat) => {
  if (!model) return;
  model.traverse((object) => {
    if (!object.isMesh || object.userData.outline) return;
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    for (const material of materials) {
      if (!material) continue;
      if (material.isShaderMaterial && material.uniforms?.uAsUnlit) {
        material.uniforms.uAsUnlit.value = flat ? 1 : 0;
      } else if (material.isMeshStandardMaterial) {
        if (!material.userData.flatBackup) {
          material.userData.flatBackup = {
            emissive: material.emissive.clone(),
            emissiveMap: material.emissiveMap,
            metalness: material.metalness,
            roughness: material.roughness
          };
        }
        const backup = material.userData.flatBackup;
        if (flat) {
          material.emissive.copy(material.color || new THREE.Color(1, 1, 1));
          material.emissiveMap = material.map || null;
          material.emissiveIntensity = 1;
          material.metalness = 0;
          material.roughness = 1;
        } else {
          material.emissive.copy(backup.emissive);
          material.emissiveMap = backup.emissiveMap;
          material.metalness = backup.metalness;
          material.roughness = backup.roughness;
        }
        material.needsUpdate = true;
      }
    }
  });
};

let hlslOn = false;
let hlslBusy = false;
let hlslQueued = false;
let viewMode = 'textured';
let baseSummary = '';
let hlslInfo = { draws: '', fallbacks: '', detail: '', summary: '', error: '', textures: '', msaa: '' };

const viewModes = document.getElementById('viewModes');
const viewGizmo = document.getElementById('viewGizmo');
const modeLabels = { textured: '贴图', clay: '白膜', wireframe: '网格' };
const modeButtons = [...viewModes.querySelectorAll('button[data-mode]')];

const clayMaterial = new THREE.MeshStandardMaterial({ color: 0xb7c0cc, roughness: 0.62, metalness: 0.02 });
const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x9fb6d8, wireframe: true });
const originalMaterials = new Map();

function applyGlbMode(mode) {
  if (!model) return;
  model.traverse((object) => {
    if (object.userData.outline) {
      object.visible = mode === 'textured';
      return;
    }

    if (!object.isMesh) return;
    if (!originalMaterials.has(object)) originalMaterials.set(object, object.material);
    object.material = mode === 'clay' ? clayMaterial : mode === 'wireframe' ? wireMaterial : originalMaterials.get(object);
  });
  renderer.render(scene, camera);
  drawGizmo();
}

function setViewMode(mode) {
  viewMode = mode;
  for (const button of modeButtons) {
    button.classList.toggle('on', button.dataset.mode === mode);
  }

  if (hlslOn) {
    requestHlsl(false);
  } else {
    applyGlbMode(mode);
  }
}

for (const button of modeButtons) {
  button.addEventListener('click', () => setViewMode(button.dataset.mode));
}

viewGizmo.classList.toggle('on', gizmoVisible);
viewGizmo.addEventListener('click', () => {
  gizmoVisible = !gizmoVisible;
  viewGizmo.classList.toggle('on', gizmoVisible);
  drawGizmo();
});

window.akashicSetHlsl = (on) => {
  if (on === hlslOn) return;
  hlslOn = !!on;
  hlslToggle.classList.toggle('on', hlslOn);
  hlslView.classList.toggle('on', hlslOn);
  controls.enabled = !hlslOn;
  if (hlslOn) {
    syncCameraFromThree();
    setStatus('正在用 D3D11 渲染…');
    requestHlsl(true);
  } else {
    applyCameraToThree();
    hideStatus();
    applyGlbMode(viewMode);
  }
};

window.akashicHlslState = () => ({ enabled: hlslOn, busy: hlslBusy, mode: viewMode });

window.akashicHlslInfo = () => {
  if (hlslOn) {
    return {
      enabled: true, busy: hlslBusy, mode: viewMode,
      gizmo: gizmoVisible, light: backgroundLight,
      draws: hlslInfo.draws, fallbacks: hlslInfo.fallbacks,
      textures: hlslInfo.textures, msaa: hlslInfo.msaa,
      detail: hlslInfo.detail, summary: hlslInfo.summary, error: hlslInfo.error
    };
  }

  return {
    enabled: false, busy: false, mode: viewMode,
    gizmo: gizmoVisible, light: backgroundLight,
    draws: '', fallbacks: '', detail: '', error: '',
    summary: `${baseSummary || '实时 3D'} · ${modeLabels[viewMode] || viewMode}`
  };
};

if (params.get('embed') === '1') {
  hlslToggle.style.display = 'none';
  bgToggle.style.top = '12px';
}
hlslToggle.addEventListener('click', () => window.akashicSetHlsl(!hlslOn));
bgToggle.addEventListener('click', () => window.akashicSetBackground(!backgroundLight));

const hlslCanvas = document.getElementById('hlslCanvas');
const hlslCtx = hlslCanvas.getContext('2d', { alpha: false });

const HLSL_FOV = 38;

let hlslDragging = false;
let hlslDragButton = -1;
let hlslDragX = 0;
let hlslDragY = 0;
let hlslFpsAt = 0;
let hlslFpsFrames = 0;
let hlslFps = 0;

function viewBasis() {
  const cosPitch = Math.cos(viewCamera.pitch);
  const dir = orbitDir(viewCamera.yaw, viewCamera.pitch);
  const forward = { x: -dir.x, y: -dir.y, z: -dir.z };
  const right = {
    x: forward.y * 0 - forward.z * 1,
    y: forward.z * 0 - forward.x * 0,
    z: forward.x * 1 - forward.y * 0,
  };
  const length = Math.hypot(right.x, right.y, right.z) || 1;
  right.x /= length;
  right.y /= length;
  right.z /= length;
  return {
    dir,
    right,
    up: {
      x: right.y * forward.z - right.z * forward.y,
      y: right.z * forward.x - right.x * forward.z,
      z: right.x * forward.y - right.y * forward.x,
    },
  };
}

function viewOrbit(dx, dy) {
  const k = 0.0075;
  viewCamera.yaw -= dx * k;
  viewCamera.pitch = Math.max(-1.5, Math.min(1.5, viewCamera.pitch + dy * k));
}

function viewPan(dx, dy) {
  if (!viewCamera.target) return;
  const { right, up } = viewBasis();
  const fov = HLSL_FOV * Math.PI / 180;
  const perPixel = 2 * viewCamera.distance * Math.tan(fov / 2) / Math.max(1, window.innerHeight);
  viewCamera.target.x += (-right.x * dx + up.x * dy) * perPixel;
  viewCamera.target.y += (-right.y * dx + up.y * dy) * perPixel;
  viewCamera.target.z += (-right.z * dx + up.z * dy) * perPixel;
}

function viewDolly(deltaY) {
  if (!viewCamera.distance) return;
  viewCamera.distance = Math.max(0.001, Math.min(2000, viewCamera.distance * Math.exp(deltaY * 0.0005)));
}

function viewClick(event) {
  const id = pickNode(event.clientX, event.clientY);
  if (id) notifyPick(id);
  else window.akashicSelect(null);
}

function viewDoubleClick(event) {
  const id = pickNode(event.clientX, event.clientY);
  if (id) {
    window.akashicFocus(id);
    return;
  }

  window.akashicResetView();
}

hlslCanvas.addEventListener('pointerdown', (event) => {
  if (!hlslOn) return;
  hlslDragging = true;
  hlslDragButton = event.button;
  hlslDragX = event.clientX;
  hlslDragY = event.clientY;
  hlslCanvas.setPointerCapture?.(event.pointerId);
  hlslCanvas.classList.add('dragging');
  event.preventDefault();
});

hlslCanvas.addEventListener('pointermove', (event) => {
  if (!hlslDragging || !hlslOn) return;
  const dx = event.clientX - hlslDragX;
  const dy = event.clientY - hlslDragY;
  if (!dx && !dy) return;
  hlslDragX = event.clientX;
  hlslDragY = event.clientY;

  if (hlslDragButton === 2) viewOrbit(dx, dy);
  else if (hlslDragButton === 1 || (hlslDragButton === 0 && event.shiftKey)) viewPan(dx, dy);
  else return;

  requestHlsl(false);
});

function endHlslDrag(event) {
  if (!hlslDragging) return;
  hlslDragging = false;
  hlslDragButton = -1;
  if (hlslCanvas.hasPointerCapture?.(event.pointerId)) hlslCanvas.releasePointerCapture(event.pointerId);
  hlslCanvas.classList.remove('dragging');
  requestHlsl(false);
}

hlslCanvas.addEventListener('pointerup', (event) => {
  const moved = hlslDragButton !== -1 &&
      (Math.abs(event.clientX - hlslDragX) > 3 || Math.abs(event.clientY - hlslDragY) > 3);
  endHlslDrag(event);
  if (hlslOn && event.button === 0 && !moved) viewClick(event);
});

hlslCanvas.addEventListener('pointercancel', endHlslDrag);
hlslCanvas.addEventListener('dblclick', viewDoubleClick);
hlslCanvas.addEventListener('contextmenu', (event) => {
  if (hlslOn) event.preventDefault();
});
hlslCanvas.addEventListener('wheel', (event) => {
  if (!hlslOn) return;
  event.preventDefault();
  viewDolly(event.deltaY);
  requestHlsl(false);
}, { passive: false });

function hlslFrameSize() {
  const rect = hlslCanvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.max(96, Math.round((rect.width || window.innerWidth) * dpr));
  const height = Math.max(96, Math.round((rect.height || window.innerHeight) * dpr));
  const scale = Math.min(1, Math.sqrt(2600000 / (width * height)));
  return { width: Math.max(96, Math.round(width * scale)), height: Math.max(96, Math.round(height * scale)) };
}

async function drawHlslFrame(pixels, width, height) {
  try {
    const bitmap = await createImageBitmap(new ImageData(pixels, width, height));
    hlslCtx.drawImage(bitmap, 0, 0, hlslCanvas.width, hlslCanvas.height);
    bitmap.close?.();
  } catch {
    const scratch = new OffscreenCanvas(width, height);
    scratch.getContext('2d').putImageData(new ImageData(pixels, width, height), 0, 0);
    hlslCtx.drawImage(scratch, 0, 0, hlslCanvas.width, hlslCanvas.height);
  }

  const now = performance.now();
  hlslFpsFrames++;
  if (now - hlslFpsAt > 500) {
    hlslFps = Math.round(hlslFpsFrames * 1000 / (now - hlslFpsAt));
    hlslFpsAt = now;
    hlslFpsFrames = 0;
  }
}

async function requestHlsl(showStatus) {
  if (!hlslOn || !ready) return;
  if (hlslBusy) { hlslQueued = true; return; }

  hlslBusy = true;
  const size = hlslFrameSize();
  if (hlslCanvas.width !== size.width || hlslCanvas.height !== size.height) {
    hlslCanvas.width = size.width;
    hlslCanvas.height = size.height;
  }

  try {
    const response = await fetch('/api/preview/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Akashic-Token': token },
      cache: 'no-store',
      body: JSON.stringify({
        sessionId: build,
        width: size.width,
        height: size.height,
        view: 'orbit',
        mode: viewMode,
        outline: true,
        gizmo: false,
        lightBackground: backgroundLight,
        raw: true,
        ...hlslOrbitParams(),
        fov: HLSL_FOV
      })
    });

    if (!response.ok) {
      const text = await response.text();
      let messageText = text;
      try { messageText = JSON.parse(text).detail || JSON.parse(text).title || text; } catch {}
      throw new Error(messageText);
    }

    const buffer = await response.arrayBuffer();
    const frameWidth = Number(response.headers.get('X-Akashic-Frame-Width')) || size.width;
    const frameHeight = Number(response.headers.get('X-Akashic-Frame-Height')) || size.height;

    await drawHlslFrame(new Uint8ClampedArray(buffer), frameWidth, frameHeight);
    drawGizmo();
    if (showStatus) hideStatus();

    const draws = response.headers.get('X-Akashic-Draws') || '?';
    const fallbacks = response.headers.get('X-Akashic-Fallbacks') || '0';
    const renderMs = response.headers.get('X-Akashic-Render-Ms') || '';
    const queueMs = Number(response.headers.get('X-Akashic-Queue-Ms') || '0');
    const textureParts = (response.headers.get('X-Akashic-Textures') || '').split('|');
    const msaa = response.headers.get('X-Akashic-Msaa') || '';
    const textureLabel = textureParts.length === 3 ? ` · 贴图 ${textureParts[0]} 张 ${textureParts[1]} MB` : '';
    const decodeLabel = textureParts[2] && textureParts[2] !== '0' ? ` · ${textureParts[2]} 张无法解码` : '';
    const aaLabel = Number(msaa) > 1 ? ` · MSAA ${msaa}×` : '';
    const detailRaw = response.headers.get('X-Akashic-Fallback-Detail') || '';
    let detail = '';
    try { detail = decodeURIComponent(detailRaw); } catch { detail = detailRaw; }

    const label = modeLabels[viewMode] || viewMode;
    const timing = renderMs ? ` · ${renderMs} ms${queueMs > 1 ? ' +' + queueMs.toFixed(0) + ' ms 排队' : ''}` : '';
    const rate = hlslFps > 0 ? ` · ${hlslFps} fps` : '';
    const head = `D3D11 实时 · ${label} · ${draws} 次绘制${aaLabel}${textureLabel}${decodeLabel}${timing}${rate}`;
    const shown = detail ? detail.split(' | ').slice(0, 2) : [];
    const text = fallbacks === '0'
      ? `${head} · 全部材质都跑的是真实着色器`
      : `${head} · ${fallbacks} 个回退材质${shown.length ? '：' + shown.join(' | ') : ''}`;

    hlslInfo = {
      draws, fallbacks, detail, summary: text, error: '',
      textures: response.headers.get('X-Akashic-Textures') || '',
      msaa
    };
  } catch (error) {
    hlslInfo = { draws: '', fallbacks: '', detail: '', summary: '', error: String(error?.message || error), textures: '', msaa: '' };
    window.akashicSetHlsl(false);
    setStatus('HLSL 渲染失败：' + (error?.message || error), true);
    setTimeout(() => { statusBox.classList.add('hide'); }, 4500);
  } finally {
    hlslBusy = false;
    if (hlslQueued) {
      hlslQueued = false;
      requestHlsl(false);
    }
  }
}

window.akashicInfo = () => ({ ready, build, meshes: countMeshes() });

function countMeshes() {
  let count = 0;
  model?.traverse((object) => { if (object.isMesh) count++; });
  return count;
}

function setStatus(text, isError = false) {
  message.textContent = text;
  statusBox.classList.toggle('error', isError);
  statusBox.classList.remove('hide');
}

function hideStatus() {
  statusBox.classList.add('hide');
}

async function boot() {
  if (!build) {
    setStatus('缺少预览会话参数。', true);
    return;
  }

  try {
    const response = await fetch(`./builds/${build}/scene.json`, { cache: 'no-store' });
    if (!response.ok) throw new Error('场景数据读取失败：' + response.status);
    const sceneData = await response.json();

    for (const node of flatten(sceneData.nodes || [])) {
      const materials = node.materials || [];
      if (materials.length > 0) materialMeta.set(node.id, materials);
      for (const material of materials) {
        if (material.name) materialByName.set(material.name.toLowerCase(), material);
      }
    }

    baseSummary = `${sceneData.name || 'Prefab'} · ${sceneData.nodeCount || 0} 节点 · ${sceneData.meshCount || 0} 网格`;

    const loader = new GLTFLoader();
    loader.load(`./builds/${build}/model.glb`, (gltf) => {
      model = gltf.scene;
      model.name = 'prefab-root';
      scene.add(model);

      model.traverse((object) => {
        if (!object.isMesh) return;
        const source = Array.isArray(object.material) ? object.material[0] : object.material;

        let list = materialMeta.get(object.name);
        let index = 0;
        if ((!list || list.length <= 1) && object.parent?.isGroup) {
          index = object.parent.children.indexOf(object);
          list = materialMeta.get(object.parent.name) || list;
        }

        const meta = (list && list.length > 1
            ? list[Math.max(0, index)] || list[0]
            : (source?.name ? materialByName.get(source.name.toLowerCase()) : null) || (list && list[0]));
        adaptMaterial(object, meta);
      });

      frameObject(model);
      controls.update();
      ready = true;
      hideStatus();
      baseSummary += ` · lilToon ${applied.liltoon} / toon ${applied.toon} / lit ${applied.lit}`;
      viewModes.classList.add('on');
      applyGlbMode(viewMode);

      if (sceneData.warnings && sceneData.warnings.length) {
        console.warn(sceneData.warnings.join('\n'));
      }
    }, (event) => {
      if (!ready && event.total) {
        const percent = Math.round(event.loaded / event.total * 100);
        setStatus(`正在载入模型 ${percent}%`);
      }
    }, (error) => {
      setStatus('模型载入失败：' + (error?.message || error), true);
    });
  } catch (error) {
    setStatus('预览初始化失败：' + (error?.message || error), true);
  }
}

function adaptMaterial(mesh, meta) {
  const kind = meta?.kind || 'lit';
  const source = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  if (!source) return;
  applied[kind in applied ? kind : 'lit']++;

  if (kind === 'liltoon' || kind === 'toon') {
    mesh.material = createLilToonMaterial(source, meta);
    addOutline(mesh, source, meta);
  } else if (kind === 'unlit') {
    const basic = new THREE.MeshBasicMaterial({
      color: source.color ? source.color.clone() : new THREE.Color(0xffffff),
      map: source.map || null,
      transparent: source.transparent,
      opacity: source.opacity ?? 1,
      side: source.side,
      alphaTest: source.alphaTest || 0
    });
    mesh.material = basic;
  } else {
    source.envMapIntensity = 0.8;
    source.needsUpdate = true;
  }
}

const whitePixel = (() => {
  const tex = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1);
  tex.needsUpdate = true;
  return tex;
})();

function colorVec(value, fallback = [1, 1, 1, 1]) {
  const list = Array.isArray(value) && value.length >= 3 ? value : fallback;
  return new THREE.Vector3(list[0], list[1], list[2]);
}

function loadOptionalTexture(relative) {
  if (!relative) return null;
  const tex = new THREE.TextureLoader().load(`./builds/${build}/${relative}`);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createLilToonMaterial(source, meta) {
  const matcap = loadOptionalTexture(meta.matCapTexture);
  const emission = meta.useEmission ? loadOptionalTexture(meta.emissionTexture) : null;

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: source.map || whitePixel },
      uHasMap: { value: source.map ? 1 : 0 },
      uColor: { value: colorVec(meta.baseColor) },
      uOpacity: { value: (meta.baseColor && meta.baseColor.length > 3) ? meta.baseColor[3] : 1 },
      uCutoff: { value: meta.cutoff ?? 0.5 },
      uAlphaMode: { value: meta.alphaMode === 'blend' ? 2 : (meta.alphaMode === 'mask' ? 1 : 0) },
      uShade1: { value: colorVec(meta.shadeColor1) },
      uShade2: { value: colorVec(meta.shadeColor2) },
      uShadowStrength: { value: meta.shadowStrength ?? 1 },
      uLightMin: { value: meta.lightMinLimit ?? 0.05 },
      uLightMax: { value: meta.lightMaxLimit ?? 1 },
      uAsUnlit: { value: meta.asUnlit ? 1 : 0 },
      uEmissionColor: { value: colorVec(meta.emissionColor, [0, 0, 0, 1]) },
      uEmissionMap: { value: emission || whitePixel },
      uHasEmission: { value: emission ? 1 : 0 },
      uUseEmission: { value: meta.useEmission ? 1 : 0 },
      uMatCap: { value: matcap || whitePixel },
      uUseMatCap: { value: 0 },
      uMatCapColor: { value: colorVec(meta.matCapColor) },
      uPremultiplied: { value: meta.premultipliedAlpha ? 1 : 0 },
      uLightDir: { value: new THREE.Vector3(2.4, 4.2, 2.8).normalize() }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewNormal;
      void main() {
        vUv = uv;
        vNormal = normalize(mat3(modelMatrix) * normal);
        vViewNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uMap;
      uniform float uHasMap;
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uCutoff;
      uniform float uAlphaMode;
      uniform vec3 uShade1;
      uniform vec3 uShade2;
      uniform float uShadowStrength;
      uniform float uLightMin;
      uniform float uLightMax;
      uniform float uAsUnlit;
      uniform vec3 uEmissionColor;
      uniform sampler2D uEmissionMap;
      uniform float uHasEmission;
      uniform float uUseEmission;
      uniform sampler2D uMatCap;
      uniform float uUseMatCap;
      uniform vec3 uMatCapColor;
      uniform vec3 uLightDir;
      uniform float uPremultiplied;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vViewNormal;

      void main() {
        vec4 texel = texture2D(uMap, vUv);
        vec3 baseTex = mix(vec3(1.0), texel.rgb, uHasMap);
        vec3 base = baseTex * uColor;
        float textureAlpha = texel.a * uOpacity;

        vec3 n = normalize(vNormal);
        float ndl = dot(n, normalize(uLightDir)) * 0.5 + 0.5;
        float lit = smoothstep(uLightMin, uLightMax, ndl);
        lit = mix(1.0, lit, clamp(uShadowStrength, 0.0, 1.0));

        vec3 dark = baseTex * uShade2;
        vec3 mid = baseTex * uShade1;
        vec3 col = mix(dark, mid, smoothstep(0.0, 0.45, lit));
        col = mix(col, base, smoothstep(0.55, 1.0, lit));
        if (uAsUnlit > 0.5) col = base;

        if (uUseEmission > 0.5) {
          vec3 emit = mix(vec3(1.0), texture2D(uEmissionMap, vUv).rgb, uHasEmission);
          col += uEmissionColor * emit;
        }

        if (uUseMatCap > 0.5) {
          vec3 viewNormal = normalize(vViewNormal);
          vec2 uvCap = viewNormal.xy * 0.5 + 0.5;
          col += texture2D(uMatCap, uvCap).rgb * uMatCapColor * 0.55;
        }

        float outAlpha = 1.0;
        if (uAlphaMode > 1.5) {
          outAlpha = textureAlpha;
        } else if (uAlphaMode > 0.5) {
          if (textureAlpha < uCutoff) discard;
        }

        vec3 outputColor = pow(max(col, 0.0), vec3(0.4545));
        if (uPremultiplied > 0.5 && uAlphaMode > 1.5) outputColor *= outAlpha;
        gl_FragColor = vec4(outputColor, outAlpha);
      }
    `,
    transparent: meta.alphaMode === 'blend',
    premultipliedAlpha: meta.premultipliedAlpha === true,
    alphaTest: 0,
    side: source.side,
    depthWrite: meta.alphaMode !== 'blend'
  });

  return material;
}

function addOutline(mesh, source, meta) {
  if (!meta?.useOutline || !(meta.outlineWidth > 0)) return;

  const width = Math.max(0.0008, meta.outlineWidth * 0.01);
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: colorVec(meta.outlineColor, [0, 0, 0, 1]) },
      uWidth: { value: width }
    },
    vertexShader: `
      uniform float uWidth;
      void main() {
        vec3 p = position + normal * uWidth;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      void main() {
        gl_FragColor = vec4(pow(max(uColor, 0.0), vec3(0.4545)), 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: true
  });

  const outline = new THREE.Mesh(mesh.geometry, material);
  outline.matrixAutoUpdate = false;
  outline.matrix.copy(mesh.matrix);
  outline.userData.outline = true;
  mesh.parent?.add(outline);
}

function flatten(nodes) {
  const result = [];
  const walk = (list) => {
    for (const node of list || []) {
      result.push(node);
      walk(node.children);
    }
  };
  walk(nodes);
  return result;
}

function frameObject(object) {
  const bounds = new THREE.Box3().setFromObject(object);
  if (bounds.isEmpty()) return;

  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 0.05);

  controls.target.copy(center);
  const distance = radius * 1.8 + 0.15;
  camera.position.set(center.x - distance * 0.72, center.y + distance * 0.46, center.z + distance * 0.85);
  camera.near = Math.max(0.001, radius / 300);
  camera.far = Math.max(100, radius * 40);
  camera.updateProjectionMatrix();
  syncCameraFromThree();

  const gridSize = Math.max(0.5, Math.ceil(radius * 4 * 100) / 100);
  grid.scale.setScalar(gridSize / 4);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (hlslOn) requestHlsl(false);
});

let glLost = false;

renderer.setAnimationLoop(() => {
  if (document.hidden || glLost) return;
  controls.update();
  if (box.visible) box.update();
  if (hlslOn) return;
  syncCameraFromThree();
  renderer.render(scene, camera);
  drawGizmo();
});

// Without preventDefault the context is never restored, and the viewer stays blank
// until the whole page reloads.
function guardContext(canvas) {
  canvas.addEventListener('webglcontextlost', (event) => {
    event.preventDefault();
    glLost = true;
    setStatus('显卡上下文丢失，正在等待恢复…', true);
  });
  canvas.addEventListener('webglcontextrestored', () => {
    glLost = false;
    hideStatus();
    if (hlslOn) requestHlsl(false); else applyGlbMode(viewMode);
  });
}

guardContext(renderer.domElement);
guardContext(gizmoCanvas);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && hlslOn && !hlslBusy) requestHlsl(false);
});

boot();
</script>
</body>
</html>
